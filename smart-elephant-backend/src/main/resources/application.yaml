spring:
  application:
    name: smart-elephant-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/smart_elephant
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  redis:
    host: localhost
    port: 6379
    password:
    timeout: 2000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    root: INFO
    com.smartelephant: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080
  servlet:
    context-path: /api

app:
  claude:
    api-key: ${CLAUDE_API_KEY:your-api-key-here}
    model: claude-3-5-sonnet-20241022
    max-tokens: 500

  tts:
    # Azure AI Speech; empty key = TTS disabled (browser voice is used instead)
    azure:
      key: ${AZURE_SPEECH_KEY:}
      region: ${AZURE_SPEECH_REGION:}
    cache-dir: ${TTS_CACHE_DIR:./audio-cache}

  rag:
    embedding-dimension: 1536
